# Self-hosted CPU text-to-speech for speaking bots: Kokoro-82M (model Apache-2.0) served by
# Kokoro-FastAPI (github.com/remsky/Kokoro-FastAPI, Apache-2.0) v0.10.0, the upstream image
# (manifest list with linux/amd64 and linux/arm64, model baked in). No paid or external TTS API.
#
# A bot sent with voice_agent_enabled gets TTS_SERVICE_URL=http://vexa-tts:8880 and TTS_API_TOKEN
# from meeting-api, POSTs /v1/audio/speech {"model":"tts-1","input":...,"voice":...,
# "response_format":"pcm"} with header X-API-Key, and plays the reply (24 kHz s16le mono, which
# is Kokoro's native output) into its microphone. The service checks the key against API_KEYS
# (Secret `vexa-tts`, created by install.sh).
apiVersion: v1
kind: ConfigMap
metadata:
  name: vexa-tts-mappings
  namespace: meetings
  labels:
    app.kubernetes.io/name: vexa-tts
    app.kubernetes.io/part-of: quorum
data:
  # The image's api/src/core/openai_mappings.json at v0.10.0, plus "auto": a bot asked to speak
  # without a voice sends voice "auto", which Kokoro-FastAPI otherwise rejects. Re-copy this file
  # from the new tag when the image is bumped.
  openai_mappings.json: |
    {
      "models": {
        "tts-1": "kokoro-v1_0",
        "tts-1-hd": "kokoro-v1_0",
        "kokoro": "kokoro-v1_0",
        "gpt-4o-mini-tts": "kokoro-v1_0"
      },
      "voices": {
        "alloy": "am_adam",
        "ash": "af_nicole",
        "coral": "bf_emma",
        "echo": "af_bella",
        "fable": "af_sarah",
        "onyx": "bm_george",
        "nova": "bf_isabella",
        "sage": "am_michael",
        "shimmer": "af_sky",
        "marin": "af_heart",
        "cedar": "am_fenrir",
        "verse": "am_puck",
        "ballad": "bm_fable",
        "auto": "af_heart"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vexa-tts
  namespace: meetings
  labels:
    app.kubernetes.io/name: vexa-tts
    app.kubernetes.io/part-of: quorum
spec:
  replicas: 1
  # Recreate, not RollingUpdate: a surge Pod would take a bot slot in the namespace pod quota.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vexa-tts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vexa-tts
        app.kubernetes.io/part-of: quorum
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tts
          # v0.10.0 (linux/amd64, linux/arm64), remsky/Kokoro-FastAPI f2a5270d2
          image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.10.0@sha256:f54c5960c2b9387f6349080a9944f8bc7e8cdb98a4ef9238cb0b0f9ff9795f44
          env:
            # The model is baked into the image; never download at startup.
            - name: DOWNLOAD_MODEL
              value: "false"
            - name: USE_GPU
              value: "false"
            # Only the API is served: no web player, no websocket TTS routes, no inline
            # [voice:...] tags or SSML in the text (the text comes from an agent).
            - name: ENABLE_WEB_PLAYER
              value: "false"
            - name: ENABLE_WEBSOCKET_TTS
              value: "false"
            - name: ENABLE_VOICE_TAGS
              value: "false"
            - name: ENABLE_SSML
              value: "false"
            # Match the CPU limit below.
            - name: OMP_NUM_THREADS
              value: "2"
            # JSON list holding the one key bots send as X-API-Key (TTS_API_TOKEN).
            - name: API_KEYS
              valueFrom:
                secretKeyRef: { name: vexa-tts, key: API_KEYS }
          ports:
            - name: http
              containerPort: 8880
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 4
          # One utterance at a time (one speaking bot per meeting, a few lines a minute).
          resources:
            requests: { cpu: "1", memory: 1536Mi }
            limits: { cpu: "2", memory: 3Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: mappings
              mountPath: /app/api/src/core/openai_mappings.json
              subPath: openai_mappings.json
              readOnly: true
      volumes:
        - name: mappings
          configMap:
            name: vexa-tts-mappings
---
apiVersion: v1
kind: Service
metadata:
  name: vexa-tts
  namespace: meetings
  labels:
    app.kubernetes.io/name: vexa-tts
    app.kubernetes.io/part-of: quorum
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vexa-tts
  ports:
    - name: http
      port: 8880
      targetPort: http
