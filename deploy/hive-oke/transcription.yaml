# CPU Whisper (faster-whisper, int8) in two tiers, both from the same image (built in
# hivecommons/vexa quorum-images.yml with `small` baked in):
#
#   realtime  Deployment vexa-transcription-rt, model `base.en`, beam 1, 4 threads, 2 replicas.
#             Every live consumer reaches it through Service `vexa-transcription` (the bots via
#             meeting-api's TRANSCRIPTION_SERVICE_URL, Quorum's Discord and companion paths via
#             QUORUM_TRANSCRIBE_URL). Chosen from an in-cluster benchmark (beam 1, 4 threads, P50 /
#             P95 per clip on 2-6 s spoken questions): tiny.en 0.5 / 0.6 s but misheard words;
#             base.en 0.8-0.9 / 1.0 s; distil-small.en 1.9 / 2.0 s; small.en 2.1-2.3 / 2.5-2.8 s.
#             2 threads is about 1.6x slower for every model, so 2 Pods x 4 threads beats 4 x 2.
#             Multilingual `base` lost the bot's name with hotwords set; base.en did not. An init
#             container fetches base.en at a pinned Hugging Face commit into an emptyDir; the
#             server itself stays offline and warms the model up before it reports ready.
#   batch     Deployment vexa-transcription, model `small`, beam 5, 1 replica, behind Service
#             `vexa-transcription-batch`, for after-meeting transcription where quality matters
#             more than latency.
#
# Both take the TRANSCRIPTION_SERVICE_TOKEN from Secret `vexa-admin` (the service's API_TOKEN).
# Probes allow 5 s: the worker answers /health between CPU-bound requests, and the 1 s default
# got a busy batch worker killed by its liveness probe mid-meeting.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vexa-transcription
  namespace: meetings
  labels:
    app.kubernetes.io/name: vexa-transcription
    app.kubernetes.io/part-of: quorum
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vexa-transcription
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vexa-transcription
        app.kubernetes.io/part-of: quorum
    spec:
      automountServiceAccountToken: false
      containers:
        - name: transcription
          # main-93bc10a-quorum (linux/amd64, linux/arm64), hivecommons/vexa 93bc10a (hotwords, warm-up)
          image: ghcr.io/hivecommons/vexa-transcription-cpu:main-93bc10a-quorum@sha256:37158bdcdffe378060994b07135759b782bb6aff6f38e0e36ab53c1321309d50
          env:
            - name: WORKER_ID
              value: "1"
            - name: MODEL_SIZE
              value: small
            - name: DEVICE
              value: cpu
            - name: COMPUTE_TYPE
              value: int8
            # Match the CPU limit below.
            - name: CPU_THREADS
              value: "4"
            # The model is baked into the image; never reach Hugging Face at startup.
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: API_TOKEN
              valueFrom:
                secretKeyRef: { name: vexa-admin, key: TRANSCRIPTION_SERVICE_TOKEN }
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests: { cpu: "2", memory: 2Gi }
            limits: { cpu: "4", memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vexa-transcription-rt
  namespace: meetings
  labels:
    app.kubernetes.io/name: vexa-transcription-rt
    app.kubernetes.io/part-of: quorum
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vexa-transcription-rt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vexa-transcription-rt
        app.kubernetes.io/part-of: quorum
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: vexa-transcription-rt
      initContainers:
        # Fetch faster-whisper `base.en` at a pinned commit of Systran/faster-whisper-base.en into the
        # model cache, and point the cache's refs/main at it so the offline server resolves it.
        - name: fetch-model
          image: ghcr.io/hivecommons/vexa-transcription-cpu:main-93bc10a-quorum@sha256:37158bdcdffe378060994b07135759b782bb6aff6f38e0e36ab53c1321309d50
          env:
            - name: MODEL_REVISION
              value: 3d3d5dee26484f91867d81cb899cfcf72b96be6c
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
          command:
            - python3
            - -c
            - |
              import os
              from faster_whisper.utils import download_model
              rev = os.environ["MODEL_REVISION"]
              print(download_model("base.en", cache_dir="/app/models", revision=rev))
              refs = "/app/models/models--Systran--faster-whisper-base.en/refs"
              os.makedirs(refs, exist_ok=True)
              with open(refs + "/main", "w") as f:
                  f.write(rev)
          volumeMounts:
            - { name: models, mountPath: /app/models }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: transcription
          # Same image and digest as the batch tier above.
          image: ghcr.io/hivecommons/vexa-transcription-cpu:main-93bc10a-quorum@sha256:37158bdcdffe378060994b07135759b782bb6aff6f38e0e36ab53c1321309d50
          env:
            - name: WORKER_ID
              value: "rt"
            - name: MODEL_SIZE
              value: base.en
            - name: DEVICE
              value: cpu
            - name: COMPUTE_TYPE
              value: int8
            # Match the CPU limit below.
            - name: CPU_THREADS
              value: "4"
            # Greedy decoding: beam 5 doubles the model's time for no gain on short live windows.
            - name: BEAM_SIZE
              value: "1"
            - name: BEST_OF
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: API_TOKEN
              valueFrom:
                secretKeyRef: { name: vexa-admin, key: TRANSCRIPTION_SERVICE_TOKEN }
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - { name: models, mountPath: /app/models }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests: { cpu: "2", memory: 1Gi }
            limits: { cpu: "4", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: models
          emptyDir: { sizeLimit: 1Gi }
---
# The live endpoint: every realtime consumer calls http://vexa-transcription:8000.
apiVersion: v1
kind: Service
metadata:
  name: vexa-transcription
  namespace: meetings
  labels:
    app.kubernetes.io/name: vexa-transcription
    app.kubernetes.io/part-of: quorum
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vexa-transcription-rt
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# The batch endpoint (`small`, beam 5): http://vexa-transcription-batch:8000.
apiVersion: v1
kind: Service
metadata:
  name: vexa-transcription-batch
  namespace: meetings
  labels:
    app.kubernetes.io/name: vexa-transcription-batch
    app.kubernetes.io/part-of: quorum
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vexa-transcription
  ports:
    - name: http
      port: 8000
      targetPort: http
