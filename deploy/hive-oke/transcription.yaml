# CPU Whisper (faster-whisper, model `small`, int8) for the bots. The image is built in
# hivecommons/vexa (quorum-images.yml) with the model baked in, so no PVC or download is needed.
# The bot posts audio windows to http://vexa-transcription:8000/v1/audio/transcriptions with the
# TRANSCRIPTION_SERVICE_TOKEN from Secret `vexa-admin` (the service's API_TOKEN).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vexa-transcription
  namespace: meetings
  labels:
    app.kubernetes.io/name: vexa-transcription
    app.kubernetes.io/part-of: quorum
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vexa-transcription
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vexa-transcription
        app.kubernetes.io/part-of: quorum
    spec:
      automountServiceAccountToken: false
      containers:
        - name: transcription
          # main-70859c1-quorum (linux/amd64, linux/arm64), hivecommons/vexa 70859c137
          image: ghcr.io/hivecommons/vexa-transcription-cpu:main-70859c1-quorum@sha256:700c4a862dd471fafb39d0a981ef62df946f9764472020389f33d662f49ace55
          env:
            - name: WORKER_ID
              value: "1"
            - name: MODEL_SIZE
              value: small
            - name: DEVICE
              value: cpu
            - name: COMPUTE_TYPE
              value: int8
            # Match the CPU limit below.
            - name: CPU_THREADS
              value: "4"
            # The model is baked into the image; never reach Hugging Face at startup.
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: API_TOKEN
              valueFrom:
                secretKeyRef: { name: vexa-admin, key: TRANSCRIPTION_SERVICE_TOKEN }
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: { cpu: "2", memory: 2Gi }
            limits: { cpu: "4", memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: vexa-transcription
  namespace: meetings
  labels:
    app.kubernetes.io/name: vexa-transcription
    app.kubernetes.io/part-of: quorum
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vexa-transcription
  ports:
    - name: http
      port: 8000
      targetPort: http
