# STARTTLS certificate for hive-mx: an hourly CronJob copies the wildcard certificate
# (cert-manager Certificate `hive-wildcard-tls` in namespace hive-hub, `*.hive.hivecommons.dev`,
# which covers mx.hive.hivecommons.dev) into Secret mail/hive-mx-tls. The cluster has no
# reflector, so this is the copy.
#
# Least privilege: the job's ServiceAccount can read exactly one Secret in hive-hub and
# get/create/update/patch exactly one Secret in mail. It never prints key material.
#
# hive-mx re-reads the certificate when the mounted file changes (pkg/mailin certReloader), and
# the kubelet refreshes Secret volumes in place, so a renewal needs no rollout and the job
# needs no rights on the Deployment. It writes only when the certificate's SHA-256 differs
# from the `hive.hivecommons.dev/source-cert-sha256` annotation on the copy.
#
# Image: alpine/kubectl (kubectl plus busybox sh/base64/sha256sum; registry.k8s.io/kubectl
# has no shell), pinned by tag and digest.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hive-mx-tls-sync
  namespace: mail
  labels:
    app.kubernetes.io/name: hive-mx-tls-sync
    app.kubernetes.io/part-of: hive-mail
---
# The only objects this directory creates outside namespace `mail`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-mx-tls-sync-read
  namespace: hive-hub
  labels:
    app.kubernetes.io/name: hive-mx-tls-sync
    app.kubernetes.io/part-of: hive-mail
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [hive-wildcard-tls]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-mx-tls-sync-read
  namespace: hive-hub
  labels:
    app.kubernetes.io/name: hive-mx-tls-sync
    app.kubernetes.io/part-of: hive-mail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-mx-tls-sync-read
subjects:
  - kind: ServiceAccount
    name: hive-mx-tls-sync
    namespace: mail
---
# resourceNames cannot narrow a plain POST create, but the job writes with server-side apply
# (a PATCH), whose create-on-patch is authorized against the name, so `create` here only ever
# creates hive-mx-tls.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-mx-tls-sync-write
  namespace: mail
  labels:
    app.kubernetes.io/name: hive-mx-tls-sync
    app.kubernetes.io/part-of: hive-mail
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [hive-mx-tls]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-mx-tls-sync-write
  namespace: mail
  labels:
    app.kubernetes.io/name: hive-mx-tls-sync
    app.kubernetes.io/part-of: hive-mail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-mx-tls-sync-write
subjects:
  - kind: ServiceAccount
    name: hive-mx-tls-sync
    namespace: mail
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hive-mx-tls-sync
  namespace: mail
  labels:
    app.kubernetes.io/name: hive-mx-tls-sync
    app.kubernetes.io/part-of: hive-mail
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hive-mx-tls-sync
            app.kubernetes.io/part-of: hive-mail
        spec:
          serviceAccountName: hive-mx-tls-sync
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: docker.io/alpine/kubectl:1.34.2@sha256:96a7d245a74d461925a56e3024d2f027c2a7a822b3e9e0117ec558db42de9c35
              imagePullPolicy: IfNotPresent
              command: [/bin/sh, -c]
              args:
                - |
                  set -eu
                  umask 077
                  w=/work
                  src_ns=hive-hub src=hive-wildcard-tls dst=hive-mx-tls
                  ann=hive.hivecommons.dev/source-cert-sha256
                  kubectl -n "$src_ns" get secret "$src" -o jsonpath='{.data.tls\.crt}' | base64 -d > "$w/tls.crt"
                  kubectl -n "$src_ns" get secret "$src" -o jsonpath='{.data.tls\.key}' | base64 -d > "$w/tls.key"
                  if [ ! -s "$w/tls.crt" ] || [ ! -s "$w/tls.key" ]; then
                    echo "source Secret $src_ns/$src has an empty tls.crt or tls.key" >&2
                    exit 1
                  fi
                  want="$(sha256sum "$w/tls.crt" | cut -d' ' -f1)"
                  have="$(kubectl -n mail get secret "$dst" -o jsonpath="{.metadata.annotations.hive\.hivecommons\.dev/source-cert-sha256}" 2>/dev/null || true)"
                  if [ "$want" = "$have" ]; then
                    echo "mail/$dst is current (cert sha256 $want)"
                    exit 0
                  fi
                  kubectl -n mail create secret tls "$dst" --cert="$w/tls.crt" --key="$w/tls.key" --dry-run=client -o yaml \
                    | kubectl annotate --local -f - "$ann=$want" -o yaml \
                    | kubectl label --local -f - app.kubernetes.io/name=hive-mx app.kubernetes.io/part-of=hive-mail -o yaml \
                    | kubectl apply --server-side --field-manager=hive-mx-tls-sync --force-conflicts -f - >/dev/null
                  rm -f "$w/tls.crt" "$w/tls.key"
                  echo "updated mail/$dst (cert sha256 ${have:-none} -> $want)"
              env:
                - name: HOME
                  value: /work
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            - name: work
              emptyDir:
                medium: Memory
                sizeLimit: 8Mi
