# Vexa Helm values for the shared Quorum meeting service on hive-oke (namespace `meetings`).
#
# Chart: deploy/helm/charts/vexa from hivecommons/vexa main at commit 70859c13728b6b819a64bb68cc5a7016e1c81f92 (chart 0.13.4,
# appVersion 0.13.4). Install with ./install.sh, which also creates the Secrets and applies the
# namespace policy rendered from the `quorum` block below.
#
# All images are pinned to an exact tag AND digest. Every Vexa image (control plane, bot, CPU
# transcription) is built from that same commit by hivecommons/vexa
# (.github/workflows/quorum-images.yml, source=main) as ghcr.io/hivecommons/vexa-*:
# main-<short sha>-quorum, multi-arch (linux/amd64 + linux/arm64); hive-oke nodes are all arm64.
# Upstream v0.12.28 lacks the meeting chat-post route, /ws chat events and the speak route that
# Quorum needs, and upstream publishes control-plane images only for releases.
#
# Upgrading: build the fork commit (README), then a PR here bumps quorum.vexaCommit and every
# pinned tag and digest below (and in transcription.yaml); nothing upgrades the cluster by itself.
# Never pin the moving main-quorum tag.

# ---- Quorum deployment knobs (read by install.sh, ignored by the chart) ----
quorum:
  # The hivecommons/vexa commit the chart is taken from and every Vexa image is built from.
  vexaCommit: 70859c13728b6b819a64bb68cc5a7016e1c81f92
  # Most meeting-bot Pods that may run at once in `meetings`. Enforced twice:
  #   1. ResourceQuota `meetings-quota`: pods = controlPlanePods + maxConcurrentBots
  #      (bot Pods are bare Pods the runtime creates, so a quota cannot select only them);
  #   2. each tenant user's max_concurrent_bots in admin-api (install.sh sets it to this value).
  # Raising it needs node capacity: each bot is Guaranteed at runtime.workloadResources.meetingBot.
  maxConcurrentBots: 4
  # Steady-state non-bot Pods in `meetings`: gateway 2, admin-api 2, meeting-api 2, runtime 1,
  # postgres 1, redis 1, versitygw 1, transcription 1, tts 1, searxng 1. While a rollout surges,
  # or an ops Pod (bucket Job, smoke test) runs, it uses bot slots; a rollout waits for a free slot.
  controlPlanePods: 13
  tenant:
    name: hivecommons-hive
    hostedHiveId: hosted-available-oke-11-placeholder-r05x

fullnameOverride: vexa

global:
  imagePullPolicy: IfNotPresent

# Secret `vexa-admin` is created by install.sh with random values (never in git). Keys:
# ADMIN_API_TOKEN, INTERNAL_API_SECRET, TRANSCRIPTION_SERVICE_TOKEN, VEXA_DISPATCH_SIGNING_KEY,
# NEXTAUTH_SECRET, VEXA_SERVICE_AUTHORITY_SECRET, VEXA_SYSTEM_WEBHOOK_SECRET, REDIS_PASSWORD,
# RUNTIME_API_TOKEN, VEXA_MCP_DELEGATION_SECRET.
secrets:
  existingSecretName: vexa-admin

# In-namespace versitygw (versitygw.yaml). Bucket created by the versitygw-bucket Job.
storage:
  s3:
    endpoint: http://versitygw:7070
    bucket: vexa-meetings
    region: us-east-1
    forcePathStyle: true
    existingSecret: vexa-s3

# The captured-signal tape (raw capture uploads for replay) stays off. This sets the chart default
# (VEXA_CAPTURE_SIGNAL_DEFAULT); install.sh also sets the fleet-wide admin-api setting to "false".
diagnostics:
  captureSignal: "false"

# The chart's NetworkPolicies are off: policy.yaml carries the gateway policy Quorum needs (the
# chart's own would take the same name, vexa-gateway-ingress), the chart's namespace default-deny
# would also cut off versitygw and the transcription service, and flannel on hive-oke enforces no
# NetworkPolicy anyway. See README "Network".
networkPolicy:
  enabled: false

# The MCP server is for agent toolbelts and personal MCP clients; Quorum uses neither.
mcp:
  enabled: false
  image:
    repository: ghcr.io/hivecommons/vexa-mcp
    tag: main-70859c1-quorum@sha256:c54722400e08af0d405196c5aa746ecb0cc97524413922b48dbc70d31e648cea

gateway:
  replicaCount: 2
  image:
    repository: ghcr.io/hivecommons/vexa-gateway
    tag: main-70859c1-quorum@sha256:e633389f107280d20e727b54142a9e7d99dbc2f32256450d7a690db7c93fdc3c
  service:
    type: ClusterIP

adminApi:
  replicaCount: 2
  image:
    repository: ghcr.io/hivecommons/vexa-admin-api
    tag: main-70859c1-quorum@sha256:18b56c39536362cda1354142128b81fce56dfdb2c3a1a2f40216735feaf335a1

meetingApi:
  replicaCount: 2
  image:
    repository: ghcr.io/hivecommons/vexa-meeting-api
    tag: main-70859c1-quorum@sha256:7a2e2c1fd03a95861c82227d4fd9f0c360149e4cce34f695066b1d1e33226ae6
  # Participants see this name; it says the bot takes notes (RFC: behaviour in the meeting).
  defaultBotName: "Hive notes (AI notetaker)"
  transcriptionServiceUrl: http://vexa-transcription:8000
  extraEnv:
    # No audio or video recording unless a request explicitly asks for it.
    - name: RECORDING_ENABLED
      value: "false"
    # Voice: a bot may speak only when its POST /bots says voice_agent_enabled: true (Quorum
    # sends that only for meeting.join with voice). This is the default for a request that does
    # not say, so it stays "false": true would make every bot a speaking bot. See README "Voice".
    - name: VOICE_AGENT_ENABLED
      value: "false"
    # Self-hosted Kokoro TTS in this namespace (tts.yaml), handed to voice bots.
    - name: TTS_SERVICE_URL
      value: http://vexa-tts:8880
    - name: TTS_API_TOKEN
      valueFrom:
        secretKeyRef: { name: vexa-tts, key: TTS_API_TOKEN }

runtime:
  backend: k8s
  replicaCount: 1
  image:
    repository: ghcr.io/hivecommons/vexa-runtime
    tag: main-70859c1-quorum@sha256:e463689e8fdc7225aec0ab6ef1360c33d04f7fb57d97b4e1f34a8404ac2082fc
  browserImage: ghcr.io/hivecommons/vexa-bot:main-70859c1-quorum@sha256:47be95ad388e7475a08c29fc66b0d504180b336189f2c4f78b29249fa67e9189
  # Agent workers are not used by Quorum (agentApi is off); pinned anyway so nothing is mutable.
  agentImage: ghcr.io/hivecommons/vexa-agent-api:main-70859c1-quorum@sha256:61b76d9cd2508ea4ad31e6c9df49ab1b44097711233d9b61d84fc798c966eb81
  agentWorkerImage: ghcr.io/hivecommons/vexa-agent-worker:main-70859c1-quorum@sha256:1ee0d6bdd3c16c984cbb5ec0766f4ca5e563f4c8a5a06e6bd3c9754c4352ff3d
  # Each spawned bot Pod: Guaranteed QoS, request == limit. Sizing per upstream production
  # guidance (deploy docs: ~1.0-1.3Gi steady, Teams spikes past 2Gi; do not go below 2560Mi).
  workloadResources:
    meetingBot:
      cpu: 1
      memoryMb: 2560
    agentWorker:
      cpu: 0.5
      memoryMb: 1024
  # Spawned bot Pods schedule on arm64 nodes (every hive-oke node today).
  nodeSelector:
    kubernetes.io/arch: arm64
  # BOT_TTS_PREWARM: short lines a voice bot synthesizes ahead of time per voice, so they play at
  # once (hivecommons/vexa#9). These are hive Betty's English acknowledgements
  # (src/pkg/meetings/betty/voice.go); keep them in step when those change.
  ttsPrewarm: "Let me check on that.|One moment.|Good question, let me look.|Let me see."
  # Off: bots run under RuntimeDefault seccomp, as on v0.12. On, the chart runs a hostPath
  # DaemonSet on every node to install a seccomp profile: that writes node files outside
  # `meetings`, and its 4 Pods would take every bot slot in the namespace pod quota.
  botSandbox:
    enabled: false
    installer:
      enabled: false

# Not needed by Quorum: no agent dispatch, no web UI (and no model credentials in this namespace).
agentApi:
  enabled: false
terminal:
  enabled: false
dashboard:
  enabled: false

podDisruptionBudgets:
  terminal:
    enabled: false
  agentApi:
    enabled: false

postgres:
  enabled: true
  image: docker.io/library/postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
  persistence:
    enabled: true
    size: 50Gi
    storageClassName: oci-bv

redis:
  enabled: true
  image: docker.io/valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
  persistence:
    enabled: true
    size: 50Gi
    storageClassName: oci-bv

ingress:
  enabled: false
